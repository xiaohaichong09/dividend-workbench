<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>离线 · 攒股收息</title>
<style>
  html { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0d1117; color: #e6edf3; padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    text-align: center;
  }
  .box { max-width: 340px; }
  .icon {
    width: 54px; height: 54px; margin: 0 auto 16px; border-radius: 16px;
    display: grid; place-items: center; font-size: 26px; font-weight: 800; color: #fff;
    background: linear-gradient(145deg, #2a5db8, #4c8dff);
  }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 13px; color: #8b98a5; line-height: 1.7; margin: 0 0 18px; }
  a {
    display: inline-block; background: #1c232d; color: #e6edf3; text-decoration: none;
    border: 1px solid #26303c; border-radius: 9px; padding: 10px 18px; font-size: 13px;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">▍</div>
    <h1>当前处于离线状态</h1>
    <p>应用外壳已缓存，但这次页面没有加载成功。恢复网络后重新打开即可；已保存的数据不会丢失。</p>
    <a href="./">重新打开</a>
  </div>
</body>
</html>
