<link rel="stylesheet" href="css/style.css">

<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/" aria-label="攒股收息首页">
      <span class="logo-mark" aria-hidden="true">▍</span>
      <span class="brand-text">
        <strong>攒股收息</strong>
        <span>退休计划</span>
      </span>
    </a>

    <nav class="nav" aria-label="主导航">
      <a href="#/" data-nav="home">总览</a>
      <a href="#/settings" data-nav="settings">设置</a>
    </nav>

    <a class="sync-chip" id="sync-chip" href="#/settings" data-state="off"
      aria-label="数据同步状态" title="数据同步状态">
      <span class="dot" aria-hidden="true"></span>
      <span class="sync-text"></span>
    </a>
  </div>
</header>

<main id="app" class="container" aria-live="polite"></main>

<div id="toast-wrap" class="toast-wrap" role="status" aria-live="polite"></div>

<div class="modal-mask" id="confirm-mask" role="dialog" aria-modal="true" aria-labelledby="confirm-text">
  <div class="modal">
    <p id="confirm-text"></p>
    <div class="btn-row modal-actions">
      <button class="btn ghost" type="button" id="confirm-no">取消</button>
      <button class="btn danger-solid" type="button" id="confirm-yes">确定</button>
    </div>
  </div>
</div>

<noscript>
  <div class="container"><div class="panel">需要开启 JavaScript 才能使用攒股收息工作台。</div></div>
</noscript>

<script defer src="js/core/util.js"></script>

<script defer src="js/app.js"></script>
</body>
